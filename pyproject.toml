[project]
name = "rag-tutorial"
version = "0.1.0"
description = "Ein Basis-Projekt für ein RAG-System mit LangChain und uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "pypdf>=6.21.3",
    "beautifulsoup4>=4.15.0",
    "ftfy>=6.3.1",
    "requests>=2.34.2",
    "trafilatura>=2.3.1",
    "clean-text>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "google-genai>=2.34.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "sentence-transformers>=6.2.0",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.4.2",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "quadrant>=1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langfuse>=5.1.0",
    "pandas>=3.1.0",
    "fastembed>=0.9.1",
    "deepeval>=4.2,<4.3",
]

[project.scripts]


[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=1.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = ["src"]
include = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["rag_tutorial"]
